name: Verify and refresh official product catalogue

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/products.json'
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scrape official catalogue
        run: |
          python - <<'PY'
          import json
          from scraper import scrape, save_data
          data = scrape()
          if not data.get("products"):
              raise SystemExit("Official sources returned zero verified products; keeping previous catalogue.")
          # Fail closed: malformed or duplicated output must never replace the live catalogue.
          products = data["products"]
          names = [p.get("name", "").strip() for p in products]
          if any(not name for name in names):
              raise SystemExit("Self-check failed: blank product name.")
          import re
          normalized = [re.sub(r"[^\\w]", "", name).casefold() for name in names]
          if len(normalized) != len(set(normalized)):
              raise SystemExit("Self-check failed: duplicate normalized product names.")
          allowed = {"人壽保險", "醫療保險", "意外保險", "癌症／重大疾病保障", "長期照護保障", "其他"}
          if any(not p.get("categories") or not set(p.get("categories", [])).issubset(allowed) for p in products):
              raise SystemExit("Self-check failed: missing or invalid category.")
          for p in products:
              for field in ("detail_url", "dm_url", "terms_url", "notice_url", "source_url"):
                  value = p.get(field)
                  if value and not value.startswith("https://www.nanshanlife.com.tw/"):
                      raise SystemExit(f"Self-check failed: non-official URL in {field} for {p.get('name')}.")
          save_data(data)
          print(json.dumps({
              "product_count": len(data["products"]),
              "updated_at": data["updated_at"],
              "source_status": data["source_status"],
              "errors": data["error"],
              "sample_names": [p["name"] for p in data["products"][:10]]
          }, ensure_ascii=False, indent=2))
          PY
      - name: Commit verified catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          if git diff --cached --quiet; then
            echo "No catalogue changes."
          else
            git commit -m "Refresh verified official product catalogue"
            git pull --rebase origin main
          git push
          fi
